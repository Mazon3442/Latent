<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524" role="img" aria-label="How Latent works" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How Latent works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7C7F"/></marker></defs>
<rect width="880" height="524" rx="16" fill="#111213"/>
<rect x="32" y="32" width="816" height="76" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/><text x="48" y="60" font-size="15" font-weight="600" fill="#ECEDE9">Interface</text><text x="48" y="84" font-size="13" fill="#A9ABA6">The window you use: prompt, sources, frames and the canvas. HTML, CSS and JavaScript in the system web view.</text><line x1="440" y1="108" x2="440" y2="146" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="448" y="131.0" font-size="12" fill="#7A7C7F">Tauri commands and events, live step previews</text><rect x="32" y="146" width="816" height="120" rx="10" fill="#202124" stroke="#FFAA2C" stroke-width="1.5"/><text x="48" y="174" font-size="15" font-weight="600" fill="#ECEDE9">Rust core (Tauri 2)</text><text x="48" y="198" font-size="13" fill="#A9ABA6">Model manager: one model in memory at a time, idle unload, cancel between steps.</text><text x="48" y="218" font-size="13" fill="#A9ABA6">Installer: a Python environment with PyTorch for your GPU or CPU, model weights from Hugging Face.</text><text x="48" y="238" font-size="13" fill="#A9ABA6">Hardware and memory readout, sources, frames, saving with the recipe in the file.</text><line x1="250" y1="266" x2="250" y2="304" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="258" y="289.0" font-size="12" fill="#7A7C7F">JSON lines over stdin/stdout</text><line x1="690" y1="266" x2="690" y2="304" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="698" y="289.0" font-size="12" fill="#7A7C7F">JSON lines</text><rect x="32" y="304" width="500" height="96" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/><text x="48" y="332" font-size="15" font-weight="600" fill="#ECEDE9">Diffusion worker (diffusers)</text><text x="48" y="356" font-size="13" fill="#A9ABA6">Z-Image Turbo · FLUX.2 [klein] · Qwen-Image-Edit · SDXL</text><text x="48" y="376" font-size="13" fill="#A9ABA6">Quantized and offloaded variants, so big models fit</text><rect x="548" y="304" width="300" height="96" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/><text x="564" y="332" font-size="15" font-weight="600" fill="#ECEDE9">Tools worker</text><text x="564" y="356" font-size="13" fill="#A9ABA6">Upscale (Real-ESRGAN)</text><text x="564" y="376" font-size="13" fill="#A9ABA6">Remove background (BiRefNet)</text><line x1="440" y1="400" x2="440" y2="432" stroke="#7A7C7F" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="448" y="420.0" font-size="12" fill="#7A7C7F"></text><rect x="32" y="432" width="816" height="60" rx="10" fill="#202124" stroke="#2A2B2F" stroke-width="1"/><text x="48" y="460" font-size="15" font-weight="600" fill="#ECEDE9">Your hardware</text><text x="180" y="460" font-size="13" fill="#A9ABA6">NVIDIA GPU (CUDA) · AMD GPU on Linux (ROCm) · Intel Arc (XPU) · CPU</text>
</svg>
