,348 H390.4 Q394.4,348 394.4,352 V358 Q394.4,362 390.4,362 H224 Z" fill="#C76A00"/><text x="402.4" y="359" font-size="13" fill="#4F5154">14.2 GB</text><path d="M224,368 H446.79999999999995 Q450.79999999999995,368 450.79999999999995,372 V378 Q450.79999999999995,382 446.79999999999995,382 H224 Z" fill="#2FB67C"/><text x="458.79999999999995" y="379" font-size="13" fill="#4F5154">18.9 GB</text><path d="M224,388 H496.0 Q500.0,388 500.0,392 V398 Q500.0,402 496.0,402 H224 Z" fill="#3987E5" fill-opacity="0.35" stroke="#3987E5" stroke-width="1.2" stroke-dasharray="3 2"/><text x="508.0" y="399" font-size="13" fill="#4F5154">about 23 GB</text><text x="208" y="450" font-size="14" fill="#141516" text-anchor="end">FLUX.3 klein</text><path d="M224,420 H374.8 Q378.8,420 378.8,424 V430 Q378.8,434 374.8,434 H224 Z" fill="#C76A00"/><text x="386.8" y="431" font-size="13" fill="#4F5154">12.9 GB</text><path d="M224,440 H353.2 Q357.2,440 357.2,444 V450 Q357.2,454 353.2,454 H224 Z" fill="#2FB67C"/><text x="365.2" y="451" font-size="13" fill="#4F5154">11.1 GB</text><path d="M224,460 H491.20000000000005 Q495.20000000000005,460 495.20000000000005,464 V470 Q495.20000000000005,474 491.20000000000005,474 H224 Z" fill="#3987E5" fill-opacity="0.35" stroke="#3987E5" stroke-width="1.2" stroke-dasharray="3 2"/><text x="503.20000000000005" y="471" font-size="13" fill="#4F5154">about 22.6 GB</text><text x="208" y="522" font-size="14" fill="#141516" text-anchor="end">FLUX.2 klein 4B</text><path d="M224,492 H337.6 Q341.6,492 341.6,496 V502 Q341.6,506 337.6,506 H224 Z" fill="#C76A00"/><text x="349.6" y="503" font-size="13" fill="#4F5154">9.8 GB</text><path d="M224,512 H318.4 Q322.4,512 322.4,516 V522 Q322.4,526 318.4,526 H224 Z" fill="#2FB67C"/><text x="330.4" y="523" font-size="13" fill="#4F5154">8.2 GB</text><path d="M224,532 H443.20000000000005 Q447.20000000000005,532 447.20000000000005,536 V542 Q447.20000000000005,546 443.20000000000005,546 H224 Z" fill="#3987E5"/><text x="455.20000000000005" y="543" font-size="13" fill="#4F5154">18.6 GB</text><text x="208" y="594" font-size="14" fill="#141516" text-anchor="end">SANA-Sprint 1.6B</text><path d="M224,564 H283.6 Q287.6,564 287.6,568 V574 Q287.6,578 283.6,578 H224 Z" fill="#C76A00"/><text x="295.6" y="575" font-size="13" fill="#4F5154">5.3 GB</text><path d="M224,584 H296.8 Q300.8,584 300.8,588 V594 Q300.8,598 296.8,598 H224 Z" fill="#2FB67C"/><text x="308.8" y="595" font-size="13" fill="#4F5154">6.4 GB</text><path d="M224,604 H362.8 Q366.8,604 366.8,608 V614 Q366.8,618 362.8,618 H224 Z" fill="#3987E5"/><text x="374.8" y="615" font-size="13" fill="#4F5154">11.9 GB</text><text x="32" y="666" font-size="12" fill="#75777A">GPU: measured with Latent on an RTX 5070 Ti (16 GB), the fastest variant that fits. Streaming from disk needs only 2 to 5 GB of VRAM,</text><text x="32" y="684" font-size="12" fill="#75777A">but keeps a copy of the model on disk (8 to 30 GB). CPU: the whole model in RAM. SANA-Sprint and FLUX.2 klein were measured on a</text><text x="32" y="702" font-size="12" fill="#75777A">Ryzen 7 7800X3D; the other CPU figures are worked out from parameter counts.</text>
</svg>
