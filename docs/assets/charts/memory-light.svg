<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 718" width="880" height="718" role="img" aria-label="Memory each model needs" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Memory each model needs</title>
<rect width="880" height="718" rx="16" fill="#F4F4F1"/>
<text x="32" y="44" font-size="20" font-weight="600" fill="#141516">Memory each model needs</text><text x="32" y="68" font-size="14" fill="#4F5154">Peak while making one 1024 × 1024 frame: VRAM on the GPU, RAM when streaming from disk or on the CPU</text><rect x="32" y="84" width="12" height="12" rx="3" fill="#C76A00"/><text x="50" y="95" font-size="13" fill="#4F5154">GPU (VRAM)</text><rect x="132" y="84" width="12" height="12" rx="3" fill="#2FB67C"/><text x="150" y="95" font-size="13" fill="#4F5154">Streamed from disk (RAM)</text><rect x="328" y="84" width="12" height="12" rx="3" fill="#3987E5"/><text x="346" y="95" font-size="13" fill="#4F5154">CPU (RAM)</text><rect x="428" y="84" width="12" height="12" rx="3" fill="#3987E5" fill-opacity="0.35" stroke="#3987E5" stroke-width="1.2" stroke-dasharray="3 2"/><text x="446" y="95" font-size="13" fill="#4F5154">CPU, estimated</text><line x1="224.0" y1="122" x2="224.0" y2="628" stroke="#D4D4CE" stroke-width="1"/><text x="224.0" y="648" font-size="12" fill="#75777A" text-anchor="middle">0 GB</text><line x1="320.0" y1="122" x2="320.0" y2="628" stroke="#D4D4CE" stroke-width="1"/><text x="320.0" y="648" font-size="12" fill="#75777A" text-anchor="middle">8 GB</text><line x1="416.0" y1="122" x2="416.0" y2="628" stroke="#D4D4CE" stroke-width="1"/><text x="416.0" y="648" font-size="12" fill="#75777A" text-anchor="middle">16 GB</text><line x1="512.0" y1="122" x2="512.0" y2="628" stroke="#D4D4CE" stroke-width="1"/><text x="512.0" y="648" font-size="12" fill="#75777A" text-anchor="middle">24 GB</text><line x1="608.0" y1="122" x2="608.0" y2="628" stroke="#D4D4CE" stroke-width="1"/><text x="608.0" y="648" font-size="12" fill="#75777A" text-anchor="middle">32 GB</text><text x="208" y="162" font-size="14" fill="#141516" text-anchor="end">Qwen-Image 2.1 Turbo</text><path d="M224,132 H346.0 Q350.0,132 350.0,136 V142 Q350.0,146 346.0,146 H224 Z" fill="#C76A00"/><text x="358.0" y="143" font-size="13" fill="#4F5154">10.5 GB</text><path d="M22