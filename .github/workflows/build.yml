# Compiles the Rust core on every platform we ship: each Linux distro's own webview and GTK headers, plus
# macOS and Windows (so the Metal and macOS data-dir code is compiled, not just written). Packaging is still
# built in release.yml; this workflow only proves the code compiles on each family.
name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch
            image: archlinux:latest
          - distro: Debian
            image: debian:bookworm
          - distro: Ubuntu
            image: ubuntu:24.04
          - distro: Fedora
            image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Arch)
        if: matrix.distro == 'Arch'
        run: |
          pacman -Syu --noconfirm --needed base-devel rust pkgconf openssl \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg xdotool

      - name: Install build dependencies (Debian, Ubuntu)
        if: matrix.distro == 'Debian' || matrix.distro == 'Ubuntu'
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Install build dependencies (Fedora)
        if: matrix.distro == 'Fedora'
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config openssl-devel libxdo-devel \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel librsvg2-devel curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Check
        run: |
          # Only rustup installs have this file. Sourcing a missing one ends a POSIX shell (Arch's sh), even with `|| true`.
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          cargo check --manifest-path app/src-tauri/Cargo.toml

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml
