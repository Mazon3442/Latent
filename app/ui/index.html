<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latent</title>
<link rel="stylesheet" href="app/ui/css/app.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; connect-src 'self' tauri: http://localhost:https:; font-src 'self' data:;">
</head>
<body>

<!-- ── top bar ──────────────────────────────────────────────────────── -->
<header class="topbar" id="topbar">
  <div class="topbar-brand">
    <svg class="topbar-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="22" height="22" aria-label="Latent">
      <circle cx="32" cy="32" r="10" fill="var(--ink)"/>
      <circle cx="56" cy="32" r="10" fill="var(--ink)"/>
      <circle cx="80" cy="32" r="10" fill="var(--ink)"/>
      <circle cx="104" cy="32" r="10" fill="var(--ink)"/>
      <circle cx="32" cy="56" r="10" fill="var(--ink)"/>
      <circle cx="56" cy="56" r="6.2" fill="var(--ink)"/>
      <circle cx="80" cy="56" r="6.2" fill="var(--noise)"/>
      <circle cx="104" cy="56" r="6.2" fill="var(--noise)"/>
      <circle cx="32" cy="80" r="10" fill="var(--ink)"/>
      <circle cx="56" cy="80" r="4.6" fill="var(--noise)"/>
      <circle cx="80" cy="80" r="4.6" fill="var(--accent)"/>
      <circle cx="104" cy="80" r="4.6" fill="var(--noise)"/>
      <circle cx="32" cy="104" r="10" fill="var(--ink)"/>
      <circle cx="56" cy="104" r="3.3" fill="var(--noise)"/>
      <circle cx="80" cy="104" r="3.3" fill="var(--noise)"/>
      <circle cx="104" cy="104" r="3.3" fill="var(--noise)"/>
    </svg>
    <span class="topbar-title">Latent</span>
  </div>

  <div class="topbar-bar" id="memoryBar">
    <div class="memory-track">
      <div class="memory-fill" id="memoryFill" style="width:0%"></div>
    </div>
    <span class="memory-label" id="memoryLabel">no GPU</span>
  </div>

  <div class="topbar-models" id="topbarModels">
    <!-- filled by JS from model catalog -->
  </div>

  <div class="topbar-actions">
    <button class="btn-icon" id="btnModels" title="Models (Ctrl+M)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="btn-icon" id="btnSettings" title="Settings (Ctrl+,)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m-9.5-9.5h4m14 0h4m-2.8-7.2-2.8 2.8m-8.4 8.4-2.8 2.8m0-14 2.8 2.8m8.4 8.4 2.8 2.8"/></svg>
    </button>
  </div>
</header>

<!-- ── main three-column layout ────────────────────────────────────── -->
<main class="workspace">

  <!-- SOURCES panel -->
  <aside class="panel sources" id="panelSources">
    <div class="panel-header">
      <span class="panel-title">SOURCES</span>
      <span class="panel-count" id="sourcesCount">0</span>
    </div>
    <div class="panel-body" id="sourcesList">
      <!-- source tiles go here -->
    </div>
    <div class="panel-footer" id="sourcesDrop">
      <div class="drop-zone" id="dropZone">
        <span class="drop-text">Drop, paste, or import photos to edit</span>
      </div>
    </div>
  </aside>

  <!-- CANVAS area -->
  <section class="canvas-area">

    <!-- canvas -->
    <div class="canvas" id="canvas">
      <div class="canvas-placeholder" id="canvasPlaceholder">
        <svg class="canvas-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="48" height="48" aria-hidden="true">
          <circle cx="32" cy="32" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="56" cy="32" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="80" cy="32" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="104" cy="32" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="32" cy="56" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="56" cy="56" r="6.2" fill="var(--ink)" opacity="0.3"/>
          <circle cx="80" cy="56" r="6.2" fill="var(--noise)" opacity="0.3"/>
          <circle cx="104" cy="56" r="6.2" fill="var(--noise)" opacity="0.3"/>
          <circle cx="32" cy="80" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="56" cy="80" r="4.6" fill="var(--noise)" opacity="0.3"/>
          <circle cx="80" cy="80" r="4.6" fill="var(--accent)" opacity="0.3"/>
          <circle cx="104" cy="80" r="4.6" fill="var(--noise)" opacity="0.3"/>
          <circle cx="32" cy="104" r="10" fill="var(--ink)" opacity="0.3"/>
          <circle cx="56" cy="104" r="3.3" fill="var(--noise)" opacity="0.3"/>
          <circle cx="80" cy="104" r="3.3" fill="var(--noise)" opacity="0.3"/>
          <circle cx="104" cy="104" r="3.3" fill="var(--noise)" opacity="0.3"/>
        </svg>
        <span class="canvas-placeholder-text">Your image will appear here</span>
      </div>
      <div class="canvas-content hidden" id="canvasContent">
        <img class="canvas-image" id="canvasImage" alt="" draggable="false">
        <div class="compare-slider hidden" id="compareSlider">
          <div class="compare-source"><img id="compareSourceImg" alt="Source"></div>
          <div class="compare-result"><img id="compareResultImg" alt="Result"></div>
          <div class="compare-handle" id="compareHandle"></div>
        </div>
        <div class="canvas-overlay hidden" id="canvasOverlay">
          <div class="canvas-step-info" id="canvasStepInfo">
            <span class="step-text" id="stepText"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- prompt -->
    <div class="prompt-area" id="promptArea">
      <textarea class="prompt-input" id="promptInput" placeholder="Describe what to make or change…" rows="1"></textarea>
      <div class="prompt-meta" id="promptMeta">
        <span class="source-label" id="sourceLabel"></span>
        <div class="size-chips" id="sizeChips">
          <!-- filled by JS -->
        </div>
        <span class="size-detail" id="sizeDetail"></span>
        <span class="batch-info" id="batchInfo"></span>
        <span class="seed-display" id="seedDisplay"></span>
        <button class="btn-link" id="btnOptions">Options</button>
        <button class="btn-link" id="btnSave" style="display:none">Save</button>
        <button class="btn-link" id="btnUseSource" style="display:none">Use as source</button>
        <div class="options-drawer hidden" id="optionsDrawer">
          <div class="option-row" id="optionSteps">
            <label>Steps</label>
            <input type="number" id="inputSteps" min="1" max="100">
          </div>
          <div class="option-row hidden" id="optionGuidance">
            <label>Guidance</label>
            <input type="number" id="inputGuidance" min="0" max="30" step="0.5">
          </div>
          <div class="option-row hidden" id="optionSampler">
            <label>Sampler</label>
            <select id="inputSampler"></select>
          </div>
          <div class="option-row hidden" id="optionStrength">
            <label>Strength</label>
            <input type="range" id="inputStrength" min="0" max="1" step="0.05">
            <span id="strengthValue"></span>
          </div>
          <div class="option-row hidden" id="optionNegative">
            <label>Negative prompt</label>
            <input type="text" id="inputNegative">
          </div>
        </div>
      </div>
      <div class="prompt-actions">
        <button class="btn btn-primary" id="btnGenerate">
          <span>Generate</span>
          <span class="btn-shortcut">Ctrl Enter</span>
        </button>
        <button class="btn btn-secondary hidden" id="btnCancel" title="Cancel (Esc)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </section>

  <!-- FRAMES panel -->
  <aside class="panel frames" id="panelFrames">
    <div class="panel-header">
      <span class="panel-title">FRAMES</span>
      <span class="panel-count" id="framesCount">0</span>
      <span class="unsaved-badge" id="unsavedBadge" style="display:none">0</span>
    </div>
    <div class="panel-body" id="framesList">
      <!-- batches of frames go here -->
    </div>
    <div class="panel-footer" id="framesFooter">
      <span class="frames-hint" id="framesHint">Frames appear after generation</span>
    </div>
  </aside>

</main>

<!-- ── status bar ──────────────────────────────────────────────────── -->
<footer class="statusbar" id="statusbar">
  <span class="status-status" id="statusStatus">Ready</span>
  <span class="status-detail" id="statusDetail"></span>
  <span class="status-unload" id="statusUnload"></span>
</footer>

<!-- ── settings drawer (full-screen overlay) ───────────────────────── -->
<div class="drawer-overlay hidden" id="settingsOverlay">
  <div class="settings-drawer" id="settingsDrawer">
    <div class="drawer-header">
      <span class="drawer-title">Settings</span>
      <button class="btn-icon" id="btnCloseSettings" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h3>Appearance</h3>
        <div class="setting-row">
          <label>Theme</label>
          <select id="settingTheme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="system">System</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <h3>Saving</h3>
        <div class="setting-row">
          <label>Save folder</label>
          <input type="text" id="settingSaveFolder" readonly>
        </div>
        <div class="setting-row">
          <label>Format</label>
          <select id="settingFormat">
            <option value="png">PNG</option>
            <option value="webp">WebP</option>
            <option value="jpeg">JPEG</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Warn on close with unsaved frames</label>
          <label class="toggle">
            <input type="checkbox" id="settingWarnClose" checked>
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
      <div class="settings-section">
        <h3>Models and memory</h3>
        <div class="setting-row">
          <label>Models folder</label>
          <input type="text" id="settingModelsFolder" readonly>
        </div>
        <div class="setting-row">
          <label>Idle unload</label>
          <select id="settingIdleUnload">
            <option value="5">5 minutes</option>
            <option value="10" selected>10 minutes</option>
            <option value="30">30 minutes</option>
            <option value="never">Never</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Warm last model at start</label>
          <label class="toggle">
            <input type="checkbox" id="settingWarmStart">
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="setting-row">
          <label>Run models on</label>
          <select id="settingComputeTarget">
            <option value="auto">Automatic</option>
            <option value="gpu">GPU</option>
            <option value="cpu">CPU</option>
          </select>
        </div>
        <div class="setting-row">
          <label>HuggingFace token</label>
          <input type="password" id="settingHfToken" placeholder="">
        </div>
      </div>
      <div class="settings-section">
        <h3>Generation defaults</h3>
        <div class="setting-row">
          <label>Frames per batch</label>
          <input type="number" id="settingBatchSize" min="1" max="8" value="1">
        </div>
        <div class="setting-row">
          <label>Default aspect ratio</label>
          <select id="settingDefaultAspect">
            <option value="1:1">1:1</option>
            <option value="4:5">4:5</option>
            <option value="3:2">3:2</option>
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── models drawer (slide-up panel) ──────────────────────────────── -->
<div class="drawer-overlay hidden" id="modelsOverlay">
  <div class="models-drawer" id="modelsDrawer">
    <div class="drawer-header">
      <span class="drawer-title">Models</span>
      <button class="btn-icon" id="btnCloseModels" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="models-body" id="modelsBody">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script src="app/ui/js/app.js"></script>

</body>
</html>
