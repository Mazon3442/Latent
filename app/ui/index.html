<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-inner"><svg class="mark" viewBox="0 0 128 128" aria-hidden="true"><circle cx="16" cy="16" r="10.0"/><circle class="noise" cx="40" cy="16" r="5.66"/><circle class="noise" cx="64" cy="16" r="3.92"/><circle class="noise" cx="88" cy="16" r="3.39"/><circle class="noise" cx="112" cy="16" r="1.82"/><circle cx="16" cy="40" r="10.0"/><circle class="noise" cx="40" cy="40" r="6.12"/><circle class="noise" cx="64" cy="40" r="4.27"/><circle class="noise" cx="88" cy="40" r="2.71"/><circle class="noise" cx="112" cy="40" r="3.23"/><circle cx="16" cy="64" r="10.0"/><circle class="noise" cx="40" cy="64" r="5.04"/><circle class="noise" cx="64" cy="64" r="4.38"/><circle class="noise" cx="88" cy="64" r="3.79"/><circle class="noise" cx="112" cy="64" r="3.83"/><circle cx="16" cy="88" r="10.0"/><circle class="live" cx="40" cy="88" r="7.0"/><circle class="noise" cx="64" cy="88" r="6.75"/><circle class="noise" cx="88" cy="88" r="5.23"/><circle class="noise" cx="112" cy="88" r="5.44"/><circle cx="16" cy="112" r="10.0"/><circle cx="40" cy="112" r="10.0"/><circle cx="64" cy="112" r="10.0"/><circle cx="88" cy="112" r="10.0"/><circle cx="112" cy="112" r="10.0"/></svg><span>Latent</span></div>
</div>
<div class="app">

  <header class="top">
    <div class="wordmark">
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true"><circle cx="16" cy="16" r="10.0"/><circle class="noise" cx="40" cy="16" r="5.66"/><circle class="noise" cx="64" cy="16" r="3.92"/><circle class="noise" cx="88" cy="16" r="3.39"/><circle class="noise" cx="112" cy="16" r="1.82"/><circle cx="16" cy="40" r="10.0"/><circle class="noise" cx="40" cy="40" r="6.12"/><circle class="noise" cx="64" cy="40" r="4.27"/><circle class="noise" cx="88" cy="40" r="2.71"/><circle class="noise" cx="112" cy="40" r="3.23"/><circle cx="16" cy="64" r="10.0"/><circle class="noise" cx="40" cy="64" r="5.04"/><circle class="noise" cx="64" cy="64" r="4.38"/><circle class="noise" cx="88" cy="64" r="3.79"/><circle class="noise" cx="112" cy="64" r="3.83"/><circle cx="16" cy="88" r="10.0"/><circle class="live" cx="40" cy="88" r="7.0"/><circle class="noise" cx="64" cy="88" r="6.75"/><circle class="noise" cx="88" cy="88" r="5.23"/><circle class="noise" cx="112" cy="88" r="5.44"/><circle cx="16" cy="112" r="10.0"/><circle cx="40" cy="112" r="10.0"/><circle cx="64" cy="112" r="10.0"/><circle cx="88" cy="112" r="10.0"/><circle cx="112" cy="112" r="10.0"/></svg>
      <span>Latent</span>
    </div>
    <div class="gpu">
      <div class="model-btns" role="group" aria-label="Model" id="modelBtns"></div>
      <div class="mem">
        <div class="bar" aria-hidden="true"><span class="fill"></span><span class="ghost"></span></div>
        <div class="mem-text" id="memText"></div>
      </div>
    </div>
    <div class="top-actions">
      <button class="update-pill" id="updateBtn" hidden></button>
      <button class="quiet" id="settingsBtn" title="Settings (Ctrl ,)">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h8M14 12h0"/><circle cx="11" cy="4" r="1.8"/><circle cx="6" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/></svg>
        Settings
      </button>
    </div>
  </header>

  <main class="main">
    <section class="col col-sources" aria-label="Sources">
      <div class="col-head">
        <h2>Sources <span class="meta" id="sourceCount"></span></h2>
        <button class="btn small" id="importBtn" title="Import photos to edit">Import</button>
      </div>
      <div class="scroll" id="sourceList"></div>
      <p class="col-note">Drop, paste (Ctrl V) or import photos. Click one to edit it with the prompt.</p>
    </section>

    <section class="col col-center" aria-label="Canvas and prompt">
      <div class="canvas" id="canvas">
        <img class="canvas-img" id="canvasPreview" alt="">
        <img class="canvas-img full" id="canvasImg" alt="">
        <div class="canvas-empty" id="canvasEmpty"></div>
        <div class="canvas-step" id="canvasStep" hidden></div>
      </div>
      <textarea class="prompt" id="prompt" rows="1" spellcheck="true" placeholder="Describe the image to make." aria-label="Prompt"></textarea>
      <div class="composer">
        <p class="recipe" id="recipe"></p>
        <p class="preflight" id="preflight" aria-live="polite"></p>
        <div class="composer-actions">
          <button class="chip controls-btn" id="controlsBtn" aria-expanded="false" aria-controls="controls" title="Steps and seed for this model">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h8M14 12h0"/><circle cx="11" cy="4" r="1.8"/><circle cx="6" cy="8" r="1.8"/><circle cx="12" cy="12" r="1.8"/></svg>Controls<span class="dot" hidden></span>
          </button>
          <button class="btn live" id="genBtn">Generate <kbd>Ctrl Enter</kbd></button>
        </div>
      </div>
    </section>

    <section class="col col-frames" aria-label="Frames">
      <div class="col-head">
        <h2>Frames</h2>
        <span class="meta" id="unsaved"></span>
      </div>
      <div class="scroll" id="frameList" role="listbox" aria-label="Frames"></div>
      <p class="col-note">Frames stay in a temporary cache until you save them. Unsaved frames are cleared when Latent closes.</p>
    </section>

    <aside class="drawer" id="controls" aria-label="Controls" inert>
      <div class="drawer-head">
        <div><h2>Controls</h2><p class="meta" id="controlsFor"></p></div>
        <div class="row">
          <button class="quiet" id="controlsReset">Reset all</button>
          <button class="btn icon" id="controlsClose" aria-label="Close controls" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </div>
      </div>
      <div class="drawer-body" id="controlsBody"></div>
    </aside>
  </main>

  <footer class="status">
    <span id="log">Starting…</span>
    <span id="idle"></span>
  </footer>
</div>

<div class="overlay" id="modelsDlg">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modelsTitle">
    <div class="dlg-head"><h3 id="modelsTitle">Models</h3>
      <button class="btn icon" data-close aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="dlg-body" id="modelsBody"></div>
  </div>
</div>

<div class="overlay" id="settingsDlg">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="dlg-head"><h3 id="settingsTitle">Settings</h3>
      <button class="btn icon" data-close aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="dlg-body" id="settingsBody"></div>
  </div>
</div>

<div class="overlay" id="updateDlg">
  <div class="dialog update" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <h3 id="upTitle"></h3>
    <p class="meta" id="upCurrent"></p>
    <div class="up-notes" id="upNotes"></div>
    <p class="up-warn" id="upWarn" hidden></p>
    <div class="progress up-progress" hidden><span id="upBar"></span></div>
    <div class="row up-foot"><span class="meta grow" id="upStatus"></span><button class="btn" id="upLater">Later</button><button class="btn live" id="upInstall">Install and restart</button></div>
  </div>
</div>

<div class="overlay" id="helpDlg">
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="dlg-head"><h3 id="helpTitle"></h3>
      <button class="btn icon" data-close aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="dlg-body help-body" id="helpBody"></div>
  </div>
</div>

<div class="menu" id="menu" role="menu"></div>

<script src="app.js"></script>
</body>
</html>
